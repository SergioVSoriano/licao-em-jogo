nuvem:
  - pergunta: "PROFETA: qual a primeira palavra que vem à sua cabeça?"
    pontua: true
    verdade: V2
    sinonimos:
      futuro: futuro
      previsao: futuro
      prever: futuro
      deus: deus
      mensageiro: mensagem
      mensagem: mensagem
      voz: porta voz
      elias: elias
      biblia: biblia
    origem: curador
    base:
      - "estamos acostumados com o termo profeta relacionado à predição do futuro"
      - "profeta é algo mais abrangente"
  - pergunta: Como podemos distinguir os verdadeiros mensageiros de Deus dos falsos?
    pontua: true
    verdade: V4
    sinonimos:
      fruto: frutos
      biblia: biblia
      palavra: biblia
      escrituras: biblia
      escritura: biblia
      carater: carater
      cristo: jesus
      jesus: jesus
      oracao: oracao
      orar: oracao
  - pergunta: "Rede semântica: que palavras vêm à sua cabeça com EXAMINAR?"
    pontua: true
    verdade: V4
    sinonimos:
      escritura: escrituras
      biblia: escrituras
      palavra: escrituras
      comparacao: comparar
      provar: provar
      testar: provar
      prova: provar
      questionar: questionar
      perguntar: questionar
    origem: curador
    base:
      - "rede semântica, que é o seu desafio"
      - "em torno da palavra 'examinar'"
  - pergunta: Qual é o seu papel, e como você pode fazer ainda mais?
    pontua: false
    verdade: V3

vozProfetica:
  - caso: 'Um vídeo "cristão" viralizou e todo mundo está compartilhando. Como saber se a mensagem está alinhada com a Palavra?'
    ref: Mt 7:15-20; 1Ts 5:19-22
    origem: curador
    base:
      - "não é porque uma mensagem é popular que necessariamente ela é verdadeira"
      - "Popularidade não é prova de verdade"
  - caso: Um amigo está passando por um tempo difícil. Como ser um "Judas e Silas" e levar ânimo e esperança para ele?
    ref: At 15:32
    origem: curador
    base:
      - "Eles tambem oferecem palavras de animo em tempos de dificil e em tempos de tribuilaçãk, o dom de profecia tem sido animo e esperança"
      - "Judas e Silas"
  - caso: Você acha que ainda é jovem demais para ser porta-voz de Deus. O que Paulo diria a você, como disse a Timóteo e Tito?
    ref: 1Tm 1:18; Tt 2:15
    origem: curador
    base:
      - "Juventude não é desculpa para falta de responsabilidade espiritual"
      - "Todo jovem precisa de alguém que o prepare"
