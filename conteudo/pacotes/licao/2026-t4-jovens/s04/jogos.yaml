curiosidades:
  - Apóstolo vem do grego apóstolos, que quer dizer "enviado".
  - Judas e Silas foram profetas e não escreveram nenhum livro da Bíblia.
  - Ana, a primeira profetisa do NT, tinha 84 anos.
  - Filipe tinha quatro filhas que profetizavam (At 21:9).
  - A Série Conflito, de Ellen White, começa e termina com a frase "Deus é amor".
  - Paulo mudou a rota da viagem por causa de uma visão de noite (At 16:9).

