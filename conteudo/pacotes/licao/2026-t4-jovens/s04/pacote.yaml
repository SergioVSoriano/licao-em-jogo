abertura:
  versiculo:
    ref: Efésios 2:20
    texto: Edificados sobre o fundamento dos apóstolos e dos profetas, sendo o próprio Cristo Jesus a principal pedra da esquina.
  tirinha:
    - Épocas diferentes…
    - …mas o mesmo Espírito.
    - Porta-voz, não espectador!
  ideiaCentral: Deus falou por meio de profetas no AT e no NT. O Espírito Santo é o mesmo e mantém Cristo no centro, e os profetas foram chamados sobretudo para conduzir as pessoas ao conhecimento de Deus e a um relacionamento com Ele.
  origem: curador
  base:
    - "Espirito Santo é o mesmo mantem o Cristo no centro da revelação. Deus falou por meio de profetas no AT e NT"
    - "Deus chamou profetas, sobretudo para condizir pessoas ao Seu conhcimento e relacionamento com Ele"

