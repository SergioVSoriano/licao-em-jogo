abertura:
  versiculo:
    ref: Amós 3:7
    texto: Certamente o Senhor Deus não fará coisa alguma, sem primeiro revelar o Seu segredo aos Seus servos, os profetas.
  tirinha:
    - Tira a minha vida!
    - Modo depressivo ativado
    - Ainda há trabalho!
  ideiaCentral: Deus fala por meio de pessoas humanas, frágeis e às vezes cansadas. Ele cuida antes de cobrar e procura gente fiel e disponível, não gente pronta ou popular.
