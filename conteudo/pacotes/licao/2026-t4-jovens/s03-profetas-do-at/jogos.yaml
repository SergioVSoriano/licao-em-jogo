    ref: 1Rs 19:5-15
  - caso: Como ser um "GPS espiritual" numa cultura de influencers e algoritmos?
    ref: Ml 4:5,6; 1Rs 22
  - caso: Como o reavivamento começa na SUA casa nesta semana?
    ref: Ml 4:6
  - caso: Você recebeu um chamado e se sente como Ellen aos 17. O que faz agora?
    ref: Testemunhos v.1 p.59-61
disfarcados:
  elias:
    - Hoje seria preso por enfrentar 850 influencers
    - Teve um burnout depois do maior sucesso da carreira
    - Nunca precisou de velório
    - Saiu de cena de carro… de fogo
  jezabel:
    - Hoje seria a rainha do cancelamento
    - Mandava em quem mandava
    - Tinha 850 funcionários religiosos na folha de pagamento
    - Ameaçou um profeta por mensagem
  micaias:
    - Seria o único "não" numa reunião de 400 "sim"
    - Prefere perder o emprego a mentir
    - Foi parar na cadeia a pão e água
    - 'O rei dizia: "eu odeio esse cara"'
  obadias:
    - Trabalhava no governo e escondia gente perseguida
    - Agente duplo do bem
    - Sabia guardar segredo (e 100 pessoas)
    - Mordomo do palácio
  debora:
    - Seria juíza com escritório debaixo de uma árvore
    - Liderou um exército junto com um general
    - Chamada de "mãe em Israel"
    - O nome lembra um inseto que faz mel
  hulda:
    - A consultora que o presidente chamou quando acharam um documento perdido
    - Casada com o responsável pelo guarda-roupa
    - Morava na parte nova da capital
    - Profetisa no tempo de Josias
  acabe:
    - Teria uma mansão toda de marfim
    - Odiava quem falava a verdade
    - Foi para a guerra disfarçado
    - Marido de uma rainha temida
  eliseu:
    - Largou o trabalho no campo para seguir um mentor
    - Pediu herança em dobro
    - Ficou com a roupa do chefe
    - Viu o mestre subir ao céu
  josafa:
    - Desconfiou quando todo mundo concordou
    - Rei do sul, aliado do rei do norte
    - Pediu uma segunda opinião
    - Perguntou se havia um profeta do Senhor
  miria:
    - Seria a líder do louvor do acampamento
    - Irmã mais velha de dois líderes famosos
    - Vigiou um cestinho num rio
    - Tocava tamborim
  josias:
    - Assumiu o trono antes de aprender a tabuada
    - Achou um livro antigo e mudou o país
    - Rasgou a própria roupa ao ouvir a leitura
    - Fez uma grande reforma
  samuel:
    - Ouvia vozes de madrugada (e era Deus)
    - Filho de uma oração chorada
    - Escolheu o primeiro rei
    - 'Disse: "Fala, que o teu servo ouve"'
curiosidades:
  - Elias significa "Meu Deus é o Senhor".
  - Micaías significa "Quem é como o Senhor?".
  - Débora significa "abelha".
  - No Carmelo, o altar foi encharcado com 12 cântaros de água antes do fogo cair.
  - Josias tinha 8 anos quando virou rei.
  - A seca do tempo de Elias durou 3 anos e meio (Tg 5:17).
  - Jezabel sustentava 850 profetas falsos (1Rs 18:19).
  - Ellen White escreveu cerca de 100 mil páginas.
  - Elias caminhou 40 dias e 40 noites até o Horebe.
  - "Obadias escondeu 100 profetas: 50 em cada cova."
