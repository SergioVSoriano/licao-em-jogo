# Conteúdo dos minijogos. Todas as listas são opcionais: o jogo sem conteúdo aparece travado no planejador.
# Pacote: 2026-q4-l03 → novo id licao-2026-t4-jovens-s03
# Formato e regras: conteudo/REGRAS.md

perguntas:
  - pergunta: Depois do Carmelo, quem ameaçou matar Elias?
    opcoes:
      - Acabe
      - Jezabel
      - Obadias
      - Hazael
    correta: Jezabel
    explicacao: Jezabel jurou matá-lo em 24 horas, e Elias fugiu.
    ref: 1Rs 19:2
    verdade: V3
  - pergunta: Debaixo de que árvore Elias pediu a morte?
    opcoes:
      - Oliveira
      - Figueira
      - Zimbro
      - Palmeira
    correta: Zimbro
    explicacao: Zimbro (giesta), no deserto, depois de Berseba.
    ref: 1Rs 19:4
    verdade: V3
  - pergunta: O que o anjo levou a Elias?
    opcoes:
      - Maná e codornizes
      - Pão cozido em brasas e água
      - Mel e gafanhotos
      - Uvas e azeite
    correta: Pão cozido em brasas e água
    explicacao: '"Levanta-te e come": Deus cuidou do corpo primeiro.'
    ref: 1Rs 19:5-6
    verdade: V3
  - pergunta: Quantos dias Elias caminhou até o Horebe?
    opcoes:
      - "7"
      - "12"
      - "40"
      - "3"
    correta: "40"
    explicacao: 40 dias e 40 noites com a força daquela comida.
    ref: 1Rs 19:8
    verdade: V3
  - pergunta: Em qual destes Deus falou com Elias no Horebe?
    opcoes:
      - Vento forte
      - Terremoto
      - Fogo
      - Voz mansa e delicada
    correta: Voz mansa e delicada
    explicacao: Deus não estava no espetáculo, mas no cicio suave.
    ref: 1Rs 19:11-12
    verdade: V3
  - pergunta: Quem Elias NÃO recebeu ordem de ungir?
    opcoes:
      - Hazael
      - Jeú
      - Eliseu
      - Josias
    correta: Josias
    explicacao: Hazael (Síria), Jeú (Israel) e Eliseu (profeta). Josias viveu séculos depois.
    ref: 1Rs 19:15-16
    verdade: V3
  - pergunta: Quantos profetas aconselharam Acabe a atacar Ramote-Gileade?
    opcoes:
      - "12"
      - "70"
      - "400"
      - "850"
    correta: "400"
    explicacao: 400 vozes em uníssono, e mesmo assim erradas.
    ref: 1Rs 22:6
    verdade: V4
  - pergunta: Por que Acabe odiava Micaías?
    opcoes:
      - Era estrangeiro
      - Nunca profetizava o bem a respeito dele
      - Roubou seu manto
      - Apoiava Jezabel
    correta: Nunca profetizava o bem a respeito dele
    explicacao: A verdade nem sempre é popular.
    ref: 1Rs 22:8
    verdade: V4
  - pergunta: 'Qual rei perguntou: "Não há aqui algum profeta do Senhor?"'
    opcoes:
      - Acabe
      - Josafá
      - Saul
      - Josias
    correta: Josafá
    explicacao: Josafá, rei de Judá, desconfiou da unanimidade.
    ref: 1Rs 22:7
    verdade: V4
  - pergunta: Como Elias foi levado ao céu?
    opcoes:
      - Numa nuvem
      - Num redemoinho, com carro de fogo
      - Numa escada
      - Nos braços de um anjo
    correta: Num redemoinho, com carro de fogo
    explicacao: Elias não morreu.
    ref: 2Rs 2:11
    verdade: V2
  - pergunta: Segundo Malaquias 4:6, a mensagem de Elias converteria o coração de…
    opcoes:
      - Reis e sacerdotes
      - Pais e filhos
      - Judeus e gentios
      - Profetas e povo
    correta: Pais e filhos
    explicacao: O reavivamento começa em casa.
    ref: Ml 4:6
    verdade: V2
  - pergunta: Qual profetisa também era juíza de Israel?
    opcoes:
      - Miriã
      - Hulda
      - Débora
      - Noadia
    correta: Débora
    explicacao: Ela julgava debaixo da "palmeira de Débora".
    ref: Jz 4:4-5
    verdade: V5
  - pergunta: Quem foi consultada quando o Livro da Lei foi encontrado?
    opcoes:
      - Débora
      - Hulda
      - Miriã
      - Ester
    correta: Hulda
    explicacao: Josias mandou Hilquias e outros consultá-la.
    ref: 2Rs 22:14
    verdade: V5
  - pergunta: Noadia é lembrada na Bíblia como…
    opcoes:
      - Juíza
      - Falsa profetisa
      - Rainha
      - Mãe de Samuel
    correta: Falsa profetisa
    explicacao: Ela tentou intimidar Neemias.
    ref: Ne 6:14
    verdade: V5
  - pergunta: Quem Samuel ungiu como o primeiro rei de Israel?
    opcoes:
      - Davi
      - Saul
      - Salomão
      - Jeú
    correta: Saul
    explicacao: O povo queria um rei "como todas as nações".
    ref: 1Sm 8:5; 10:1
    verdade: V6
  - pergunta: Que sacerdote foi apedrejado por ordem do rei Joás?
    opcoes:
      - Eli
      - Hilquias
      - Zacarias, filho de Joiada
      - Arão
    correta: Zacarias, filho de Joiada
    explicacao: Profetas pagavam caro para confrontar reis.
    ref: 2Cr 24:20-22
    verdade: V6
  - pergunta: Qual destas NÃO era uma função dos profetas?
    opcoes:
      - Aconselhar reis
      - Repreender sacerdotes
      - Escrever mensagens
      - Cobrar impostos
    correta: Cobrar impostos
    explicacao: Profetizar é orientar, confrontar, instruir e escrever.
    ref: 2Cr 13:22
    verdade: V6
  - pergunta: Com que idade Ellen Harmon recebeu o chamado profético?
    opcoes:
      - "12"
      - "17"
      - "25"
      - "33"
    correta: "17"
    explicacao: Jovem, tímida e de saúde frágil.
    ref: Testemunhos v.1
    verdade: V7
  - pergunta: O que Ellen pediu a Deus ao receber o encargo?
    opcoes:
      - Riquezas
      - Que fosse dado a outra pessoa
      - Uma terceira visão
      - Para mudar de país
    correta: Que fosse dado a outra pessoa
    explicacao: Como Elias, ela chegou a desejar a morte. Depois, se rendeu.
    ref: Testemunhos v.1 p.59-60
    verdade: V7
  - pergunta: Em que ano a IASD foi organizada oficialmente?
    opcoes:
      - "1844"
      - "1863"
      - "1888"
      - "1915"
    correta: "1863"
    explicacao: Com forte influência do ministério de Ellen White.
    ref: Lição, sexta
    verdade: V7
  - pergunta: '"Elias era humano como nós" está em…'
    opcoes:
      - Tiago 5:17
      - Hebreus 11
      - Romanos 8
      - 1 Pedro 2
    correta: Tiago 5:17
    explicacao: Profetas eram humanos, sujeitos às mesmas lutas.
    ref: Tg 5:17
    verdade: V3
  - pergunta: Qual versículo diz que Deus revela seus segredos aos profetas?
    opcoes:
      - Amós 3:7
      - Joel 2:28
      - Jeremias 1:5
      - Isaías 6:8
    correta: Amós 3:7
    explicacao: É o verso de abertura da semana.
    ref: Am 3:7
    verdade: V1
  - pergunta: Quantos profetas Obadias escondeu em covas?
    opcoes:
      - "12"
      - "50"
      - "100"
      - "400"
    correta: "100"
    explicacao: 50 em cada cova.
    ref: 1Rs 18:4
    verdade: V6
  - pergunta: Em 1 Reis 22, os 400 profetas falavam em nome de…
    opcoes:
      - Baal
      - Aserá
      - Do Senhor
      - Moloque
    correta: Do Senhor
    explicacao: A falsificação mais perigosa usa o nome de Deus.
    ref: 1Rs 22:6,11
    verdade: V4
verdadeiroOuFalso:
  - afirmacao: Elias morreu idoso e foi enterrado em Jezreel.
    verdadeira: false
    explicacao: Ele foi levado ao céu num redemoinho.
    ref: 2Rs 2:11
    verdade: V2
  - afirmacao: Logo depois da vitória no Carmelo, Elias entrou em desespero.
    verdadeira: true
    explicacao: Ameaçado por Jezabel, fugiu e pediu a morte.
    ref: 1Rs 19:3-4
    verdade: V3
  - afirmacao: Deus estava no terremoto.
    verdadeira: false
    explicacao: Não estava no vento, nem no terremoto, nem no fogo, e sim na voz mansa.
    ref: 1Rs 19:11-12
    verdade: V3
  - afirmacao: Antes de dar uma nova missão, Deus mandou Elias comer e descansar.
    verdadeira: true
    explicacao: Deus cuida antes de cobrar.
    ref: 1Rs 19:5-8
    verdade: V3
  - afirmacao: Elias era realmente o único fiel em Israel.
    verdadeira: false
    explicacao: Havia 7 mil que não dobraram os joelhos a Baal.
    ref: 1Rs 19:18
    verdade: V3
  - afirmacao: Se a maioria dos profetas concorda, a mensagem é de Deus.
    verdadeira: false
    explicacao: Eram 400 contra 1, e o 1 estava certo.
    ref: 1Rs 22
    verdade: V4
  - afirmacao: Micaías só falou depois de ouvir o que Deus diria.
    verdadeira: true
    explicacao: '"O que o Senhor me disser, isso falarei."'
    ref: 1Rs 22:14
    verdade: V4
  - afirmacao: Na Bíblia, só homens receberam o dom de profecia.
    verdadeira: false
    explicacao: Miriã, Débora e Hulda foram profetisas.
    ref: Êx 15:20; Jz 4:4; 2Rs 22:14
    verdade: V5
  - afirmacao: O papel principal de um profeta era prever o futuro.
    verdadeira: false
    explicacao: "O profeta revelava o coração de Deus: orientava, confrontava e instruía."
    ref: Lição, quinta
    verdade: V6
  - afirmacao: Profetas também repreendiam sacerdotes corruptos.
    verdadeira: true
    explicacao: Um exemplo é a casa de Eli.
    ref: 1Sm 2:27-36
    verdade: V6
  - afirmacao: Deus só usa pessoas mais velhas e experientes.
    verdadeira: false
    explicacao: Samuel era menino, Josias tinha 8 anos e Ellen tinha 17.
    ref: 2Cr 34:1
    verdade: V6
  - afirmacao: Ellen White aceitou o chamado imediatamente, sem medo.
    verdadeira: false
    explicacao: Ela orou para que o encargo fosse dado a outra pessoa.
    ref: Testemunhos v.1
    verdade: V7
  - afirmacao: Ellen White deixou cerca de 100 mil páginas escritas.
    verdadeira: true
    explicacao: É a contribuição mais importante do seu ministério.
    ref: Lição, sexta
    verdade: V7
  - afirmacao: Jesus também foi reconhecido como profeta.
    verdadeira: true
    explicacao: '"Este é Jesus, o profeta de Nazaré."'
    ref: Mt 21:11
    verdade: V6
linhasDoTempo:
  - id: carmelo-horebe
    titulo: Do Carmelo ao Horebe
    ref: 1Rs 18–19
    eventos:
      - Fogo do céu no Carmelo
      - Jezabel ameaça Elias
      - Fuga até Berseba
      - Pede a morte debaixo do zimbro
      - Anjo traz pão e água
      - 40 dias até o Horebe
      - Ouve a voz mansa e delicada
  - id: josias
    titulo: Josias e o Livro da Lei
    ref: 2Rs 22; 2Cr 34
    eventos:
      - Josias vira rei aos 8 anos
      - Reforma do templo
      - Hilquias acha o Livro da Lei
      - Safã lê o Livro ao rei
      - Josias rasga as vestes
      - Consultam a profetisa Hulda
  - id: jornada-elias
    titulo: A jornada completa de Elias
    ref: 1Rs 17 – 2Rs 2
    eventos:
      - Anuncia a seca a Acabe
      - Corvos o alimentam em Querite
      - A viúva de Sarepta
      - Desafio no Monte Carmelo
      - Voz mansa no Horebe
      - Sobe num carro de fogo
  - id: vozes
    titulo: Vozes de Deus na história
    ref: Lição 3
    eventos:
      - Miriã
      - Débora
      - Samuel
      - Elias
      - Hulda
      - Ellen G. White
