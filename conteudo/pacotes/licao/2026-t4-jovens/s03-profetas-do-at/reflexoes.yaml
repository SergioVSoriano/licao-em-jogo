# Momento Revelação, pontes do santuário e resumo (campos interpretativos: só o curador escreve)
# Pacote: 2026-q4-l03 → novo id licao-2026-t4-jovens-s03
# Formato e regras: conteudo/REGRAS.md

revelacoes:
  - jogo: nuvem
    verdade: V3
    versiculo:
      ref: 1 Reis 19:5
      texto: '"Levanta-te e come."'
    naLicao: 'Segunda: depois do maior milagre da carreira, Elias entrou em pânico, fugiu e pediu a morte. A lição lembra: "Elias era humano como nós".'
    naBiblia:
      - ref: 1Rs 19:4
        texto: '"Basta, Senhor! Tira a minha vida."'
      - ref: 1Rs 19:5-8
        texto: O anjo traz pão e água duas vezes, antes de qualquer sermão.
    ideia: Deus cuida antes de cobrar. Às vezes, o mais espiritual a fazer é dormir e comer.
    pergunta: Qual é o seu "zimbro"? Onde você se esconde quando chega no limite?
    enquete:
      pergunta: Quando estou no limite, eu…
      opcoes:
        - 🫥 Sumo do mapa
        - 😴 Durmo 12 horas
        - 🗣️ Desabafo com alguém
        - 🙂 Finjo que está tudo bem
    outrasPerguntas:
      - O que seria "pão e água" para você hoje? Quem já foi "anjo" na sua vida?
      - Por que é tão difícil admitir que estamos cansados, inclusive na igreja?
    nota: "Comece pela nuvem: pergunte quem escreveu as palavras diferentes e por quê."
  - jogo: linha
    verdade: V3
    versiculo:
      ref: 1 Reis 19:12
      texto: '"…depois do fogo, uma voz mansa e delicada."'
    naLicao: 'A tirinha da semana: "Tira a minha vida!" → "Modo depressivo ativado" → "Ainda há trabalho!". Deus não encerrou o chamado de Elias: deu descanso, conversa e novas tarefas.'
    naBiblia:
      - ref: 1Rs 19:11-12
        texto: Vento, terremoto, fogo… e Deus estava na voz mansa.
      - ref: 1Rs 19:15-16
        texto: "Nova missão: ungir Hazael, Jeú e Eliseu. Elias ganhou uma equipe."
    ideia: Depois do espetáculo do Carmelo, Deus falou no silêncio e deu a Elias um sucessor.
    pergunta: Se a sua semana fosse a história de Elias, você estaria em qual parte?
    enquete:
      pergunta: Minha semana está mais para…
      opcoes:
        - "🔥 Carmelo: tudo dando certo"
        - "🌳 Zimbro: no limite"
        - "🕳️ Caverna: escondido"
        - "🫒 Nova missão: recomeçando"
    outrasPerguntas:
      - 'Onde você costuma ouvir a "voz mansa" de Deus: no barulho ou no silêncio?'
      - Por que Deus deu a Elias um parceiro (Eliseu) em vez de só consolá-lo?
  - jogo: verdade
    verdade: V4
    versiculo:
      ref: 1 Reis 22:14
      texto: '"O que o Senhor me disser, isso falarei."'
    naLicao: 'Terça: 400 profetas disseram "sobe!" ao rei. Micaías, sozinho, disse a verdade, levou um tapa e foi preso. E a palavra dele se cumpriu.'
    naBiblia:
      - ref: 1Rs 22:6,11
        texto: 'Os 400 falavam "em nome do Senhor": a falsificação usava o nome de Deus.'
      - ref: 1Rs 22:8
        texto: 'Acabe: "Eu o odeio, porque nunca profetiza de mim o que é bom."'
    ideia: Popular não é sinônimo de verdadeiro. E verdade sem amor também não convence ninguém.
    pergunta: Qual "verdade popular" da internet você já acreditou e depois descobriu que era falsificação?
    enquete:
      pergunta: No grupo da família, você seria o Micaías?
      opcoes:
        - 🗣️ Sim, falo mesmo
        - 🤫 Só no privado
        - 😅 Mando figurinha e saio
        - 🫠 Concordo com os 400
    outrasPerguntas:
      - Por que é tão difícil discordar da maioria?
      - Como falar a verdade com amor, sem virar o "chato" do grupo?
    nota: "Pergunta original do comENTE (terça): por que a popularidade nem sempre é um guia confiável?"
  - jogo: sinais
    verdade: V5
    versiculo:
      ref: 2 Reis 22:14
      texto: Foram à profetisa Hulda… e falaram com ela.
    naLicao: "Quarta (Momento Hipertexto): Deus chamou mulheres para o dom profético. O problema nunca foi ser mulher, mas ser fiel ou infiel ao chamado."
    naBiblia:
      - ref: Êx 15:20
        texto: Miriã liderou o louvor com tamborim.
      - ref: Jz 4:4-5
        texto: "Débora: profetisa e juíza debaixo da palmeira."
      - ref: 2Rs 22:14
        texto: Hulda aconselhou o rei sobre o Livro da Lei.
    ideia: Profetisa = pessoa de coragem. Deus procura fidelidade, não um perfil.
    pergunta: Se você pudesse tomar um café com Miriã, Débora ou Hulda, quem escolheria e o que perguntaria?
    enquete:
      pergunta: Com quem você tomaria um café?
      opcoes:
        - 🪘 Miriã
        - 🌴 Débora
        - 📜 Hulda
    outrasPerguntas:
      - Quem é uma "Débora" ou "Hulda" na sua vida hoje?
      - O que o rei Josias fez de certo ao procurar Hulda?
  - jogo: sortes
    verdade: V6
    versiculo:
      ref: Mateus 21:11
      texto: '"Este é Jesus, o profeta de Nazaré da Galileia."'
    naLicao: "Quinta: profeta não é só quem prevê o futuro. Os profetas aconselhavam reis, repreendiam sacerdotes, ensinavam o povo e escreviam as mensagens."
    naBiblia:
      - ref: 1Sm 8:5,11-18
        texto: Samuel avisou o custo de ter um rei "como as outras nações".
      - ref: 2Cr 24:20-21
        texto: Zacarias foi apedrejado por confrontar o rei Joás.
    ideia: "Coragem não é ausência de medo: é não deixar o medo governar."
    pergunta: Se um profeta mandasse uma mensagem direta para a sua geração, sobre o que ela seria?
    enquete:
      pergunta: A mensagem para a nossa geração seria sobre…
      opcoes:
        - 📱 Telas e distrações
        - 💸 Dinheiro e status
        - 😮‍💨 Ansiedade e cansaço
        - 🏠 Família e relacionamentos
    outrasPerguntas:
      - Jesus também foi chamado de profeta (Lc 7:16). O que Ele fazia de "profético"?
      - Qual pergunta do jogo mais te surpreendeu?
    nota: "Pergunta original do comPARTILHE (quinta): como as funções dos profetas ajudam a entender Jesus como profeta?"
  - jogo: duelo
    verdade: V6
    versiculo:
      ref: 1 Reis 18:21
      texto: '"Até quando coxeareis entre dois pensamentos?"'
    naLicao: 'Domingo e segunda: no Monte Carmelo, Elias desafiou 450 profetas de Baal. O fogo caiu e o povo gritou: "Só o Senhor é Deus!".'
    naBiblia:
      - ref: 1Rs 18:21
        texto: 'O povo "não respondeu nada": estava em cima do muro.'
      - ref: 1Rs 18:38-39
        texto: O fogo consumiu até a água. "Só o Senhor é Deus!"
    ideia: Ficar em cima do muro também é uma escolha.
    pergunta: Em que área da vida é mais fácil ficar "coxeando entre dois pensamentos"?
    enquete:
      pergunta: Meu "muro" mais difícil é…
      opcoes:
        - 📅 O sábado
        - 🎵 O que eu ouço e assisto
        - 💬 Como eu falo
        - ⏰ Meu tempo com Deus
    outrasPerguntas:
      - O que fez o povo finalmente escolher um lado no Carmelo?
      - Coragem é mais difícil num duelo público ou numa escolha que ninguém vê?
  - jogo: acrostico
    verdade: V2
    versiculo:
      ref: Malaquias 4:6
      texto: '"Ele converterá o coração dos pais aos filhos e o coração dos filhos a seus pais."'
    naLicao: 'Domingo: Elias foi um "GPS espiritual" para Israel. Antes da volta de Jesus, a mensagem de Elias chama a deixar os ídolos, começando pelos lares.'
    naBiblia:
      - ref: Ml 4:5-6
        texto: Deus promete enviar "o profeta Elias" antes do grande Dia do Senhor.
      - ref: 2Rs 2:11
        texto: Elias foi levado ao céu num redemoinho.
    ideia: A cultura muda, a Palavra permanece. E o reavivamento que não chega em casa é só "teatrinho".
    pergunta: Se a sua família avaliasse a sua fé com estrelas esta semana, quantas você levaria? 😅
    enquete:
      pergunta: Quantas ⭐ a minha família daria para a minha fé esta semana?
      opcoes:
        - ⭐
        - ⭐⭐
        - ⭐⭐⭐
        - ⭐⭐⭐⭐⭐
    outrasPerguntas:
      - Que atitude pequena mudaria o clima da sua casa esta semana?
      - Em que a cultura tem sido o seu GPS sem você perceber?
  - jogo: fruto
    verdade: V4
    versiculo:
      ref: Deuteronômio 18:20
      texto: O profeta que falar em Meu nome o que Eu não mandei… morrerá.
    naLicao: "Terça: Israel recebeu profetas verdadeiros, mas também enfrentou falsificações. O desafio era reconhecer a verdadeira origem da mensagem."
    naBiblia:
      - ref: Ne 6:14
        texto: Noadia, falsa profetisa, tentou intimidar Neemias.
      - ref: Ez 13:17
        texto: Havia quem "profetizava do próprio coração".
    ideia: "Para reconhecer o falso, é preciso conhecer o original: a Palavra e o Espírito."
    pergunta: Qual verdade desta lição é mais difícil de explicar sem cair no clichê?
    enquete:
      pergunta: Antes de compartilhar algo sobre fé na internet, eu…
      opcoes:
        - 🔎 Confiro a fonte
        - 👀 Vejo quem postou
        - ❤️ Compartilho se me tocou
        - 😬 Nem penso
    outrasPerguntas:
      - Como diferenciar um conteúdo cristão que "parece certo" de um que é bíblico?
      - Quem você procura quando tem dúvida sobre algo da fé?
  - jogo: sonho
    verdade: V2
    versiculo:
      ref: Malaquias 4:5
      texto: '"Eis que Eu vos enviarei o profeta Elias…"'
    naLicao: "Domingo: a cultura no tempo de Elias era de idolatria, e muitas vozes disputavam o coração do povo. Elias mostrava o caminho de volta."
    naBiblia:
      - ref: 1Rs 18:19
        texto: 850 profetas de Baal e Aserá comiam na mesa de Jezabel.
      - ref: 1Rs 19:18
        texto: Mesmo assim, 7 mil não dobraram os joelhos a Baal.
    ideia: Como no sonho do jogo, há vozes que ajudam e vozes que confundem. Discernir é treinar o ouvido.
    pergunta: Quem são os "anjos" e os "falsos profetas" (as vozes que te ajudam e as que te confundem) na sua rotina?
    enquete:
      pergunta: A voz que mais me influencia hoje é…
      opcoes:
        - 👨‍👩‍👧 Família
        - 📱 Redes sociais
        - 🧑‍🤝‍🧑 Amigos
        - 📖 A Bíblia
    outrasPerguntas:
      - Elias achou que era o único fiel, mas havia 7 mil. Você já se sentiu "o único" em algum lugar?
      - Qual "ídolo" moderno mais disputa o seu coração?
  - jogo: disfarcados
    verdade: V3
    versiculo:
      ref: Tiago 5:17
      texto: '"Elias era homem semelhante a nós."'
    naLicao: "Segunda: a Bíblia não esconde as fraquezas dos seus heróis. Elias, Miriã, Samuel… todos humanos, e Deus os usou mesmo assim."
    naBiblia:
      - ref: Nm 12; Mq 6:4
        texto: Miriã murmurou e foi repreendida, e continuou lembrada como líder do povo.
      - ref: 1Rs 18:3-4
        texto: Obadias trabalhava no palácio de Acabe e escondeu 100 profetas.
    ideia: Os heróis da Bíblia eram humanos, e Deus os usou mesmo assim.
    pergunta: Com qual personagem desta semana você mais se identifica? Por quê?
    enquete:
      pergunta: Eu me identifico mais com…
      opcoes:
        - 🔥 Elias
        - 🗣️ Micaías
        - 🕳️ Obadias
        - 🌴 Débora
        - 📜 Hulda
        - 👑 Josias
    outrasPerguntas:
      - Obadias era fiel trabalhando para um rei mau. Dá para ser fiel num ambiente hostil?
      - E qual personagem você NÃO gostaria de ser? 😅
  - jogo: atos
    verdade: V6
    versiculo:
      ref: Jeremias 42:4
      texto: '"Eis que orarei ao Senhor, vosso Deus…"'
    naLicao: "Quinta: profetas eram pessoas de oração e de ação. Às vezes encenavam a mensagem, como Jeremias andando com um jugo no pescoço."
    naBiblia:
      - ref: Jr 27:2
        texto: '"Faze brochas e jugos e põe-nos ao teu pescoço."'
      - ref: Ez 4:4-6
        texto: Ezequiel ficou deitado de lado por dias, como sinal para o povo.
    ideia: A mensagem mais forte, às vezes, é a que a gente vive, não a que a gente fala.
    pergunta: Se a sua vida fosse uma "encenação profética" esta semana, o que as pessoas entenderiam sobre Deus só de te ver?
    enquete:
      pergunta: Meu "ato profético" desta semana vai ser…
      opcoes:
        - 🙏 Orar por alguém
        - 🤝 Ajudar sem ninguém pedir
        - 📵 Um tempo sem celular
        - 💬 Pedir perdão
    outrasPerguntas:
      - Qual cena foi a mais engraçada de encenar? E que mensagem ela carrega?
      - Quem você conhece que "prega" mais com atitudes do que com palavras?
  - jogo: voz
    verdade: V7
    versiculo:
      ref: Testemunhos, v.1, p.61
      texto: '"…cumprir Sua ordem, não importando o que fosse."'
    naLicao: "Sexta: Ellen Harmon tinha 17 anos, saúde frágil e muito medo. Orou para o encargo ir para outra pessoa e chegou a desejar a morte. Encorajada por irmãos, ela se rendeu."
    naBiblia:
      - ref: Testemunhos v.1 p.59
        texto: '"Orei para que esse encargo fosse removido de mim e posto sobre alguém mais capaz."'
      - ref: 1Sm 3:10
        texto: 'O menino Samuel: "Fala, porque o teu servo ouve."'
    ideia: Deus não chama os prontos, capacita os disponíveis.
    pergunta: Se Deus te chamasse hoje para ser voz de esperança onde você vive, qual seria a sua primeira desculpa? 😅
    enquete:
      pergunta: Minha primeira desculpa seria…
      opcoes:
        - '"Sou muito novo(a)"'
        - '"Não sei falar"'
        - '"Não tenho tempo"'
        - '"Tem gente melhor"'
    outrasPerguntas:
      - A Ellen foi encorajada por irmãos de fé. Quem você poderia encorajar esta semana?
      - Qual "limitação" sua Deus poderia usar?
    nota: "Pergunta do Diálogo Aberto (sábado): se Deus me chamasse hoje para ser uma voz de esperança, qual seria a minha resposta?"
pontesDoSantuario:
  porta: O chamado começa com um "sim".
  altar: Como o altar de 12 pedras no Carmelo.
  pia: Deus restaurou Elias com descanso.
  mesa: O pão que o anjo trouxe a Elias.
  candelabro: "Profetas como GPS: luz no caminho."
  incenso: Profetas eram pessoas de oração.
  veu: Quase lá!
  arca: O véu se rasgou!
resumo:
  perguntas:
    - Em quais áreas da minha vida tenho querido compreender tudo antes de obedecer ao que Deus já revelou?
    - Tenho recebido as advertências do Senhor como ameaças ou como expressão do Seu amor?
    - Se Deus me chamasse hoje para ser uma voz de esperança no ambiente em que vivo, qual seria a minha resposta?
  versiculos:
    - ref: Amós 3:7
      texto: Deus revela Seus segredos aos profetas.
    - ref: 1 Reis 19:4-5
      texto: '"Basta, Senhor!"… "Levanta-te e come."'
    - ref: 1 Reis 19:12
      texto: Depois do fogo, uma voz mansa e delicada.
    - ref: 1 Reis 22:14
      texto: '"O que o Senhor me disser, isso falarei."'
    - ref: Malaquias 4:6
      texto: Converter o coração dos pais aos filhos e dos filhos aos pais.
    - ref: Tiago 5:17
      texto: Elias era humano como nós.
